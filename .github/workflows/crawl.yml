name: Crawl deals and sync stores

on:
  schedule:
    # 03:00 KST = 18:00 UTC (전날)
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: 행사 정보 크롤링 (CU/GS25/세븐일레븐/이마트24)
        run: npm run crawl

      # 매장 좌표는 거의 바뀌지 않는데(신규 출점 정도), 이 단계가 실패하면
      # 아래 커밋 단계가 통째로 skip 되면서 매일 갱신돼야 할 행사 데이터까지 버려졌다.
      # (2026-08-03 실행: 크롤링은 성공했는데 공공데이터 API 타임아웃으로 전체 폐기)
      # 행사 데이터 갱신이 이 앱의 핵심이므로 매장 동기화 실패는 넘어간다.
      # 2026-08-01 무렵부터 apis.data.go.kr이 러너 IP에서 응답하지 않는다(page 1부터 타임아웃).
      # 같은 요청이 로컬에서는 0.6초에 오므로 API 장애가 아니라 IP 차단으로 보인다.
      # 재시도해도 소용없어 빠르게 포기시킨다(예전엔 60초 x 4회로 매일 5분을 버렸다).
      # 매장 좌표는 거의 바뀌지 않으므로, 필요할 때 로컬에서 `npm run sync:stores`로 갱신한다.
      # 차단이 풀리면 이 단계가 다시 성공하면서 자동으로 복구된다.
      - name: 매장 위치 동기화 (차단 시 건너뜀)
        continue-on-error: true
        env:
          SBIZ_API_KEY: ${{ secrets.SBIZ_API_KEY }}
          SBIZ_TIMEOUT_MS: '20000'
          SBIZ_RETRIES: '1'
        run: npm run sync:stores

      # 갱신된 데이터로 날씨 추천 상위 20개를 찍어둔다. 실행 로그에서 눈으로 확인하고,
      # 이상한 상품이 보일 때만 1_1.html의 [weather-rules] 블록을 고치면 된다.
      # 점검 실패가 데이터 갱신을 막아서는 안 되므로 통과 여부는 따지지 않는다.
      - name: 날씨 추천 결과 점검 (참고용 출력)
        continue-on-error: true
        run: npm run check:weather

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "편의점 행사/deals.json" "편의점 행사/stores/"
          git diff --cached --quiet || git commit -m "chore: 행사/매장 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
          git push
